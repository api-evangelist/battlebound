name: Battlebound
description: Battlebound was a Los Angeles-based blockchain / play-to-earn game studio
  founded in May 2021 by former Riot Games technical artist Adam Hensel (pseudonym Damos),
  with a team drawn from Blizzard, Ubisoft, NCSoft and Riot Games. In March 2022 it
  raised a $4.8M seed round led by Andreessen Horowitz (a16z) with participation from
  Play Ventures and Dapper Labs. Its titles were Evaverse, a Steam-published social
  metaverse game using NFTs as playable avatars, and an in-development RPG codenamed
  Anterris (also referenced as "Project A"). The studio wound down amid the collapse
  of the web3 gaming market; as of 2025 it is defunct and the battlebound.com domain
  is parked and listed for sale. The company never published a public API, SDK, or
  developer platform, so there is no API surface to catalog or enrich.
